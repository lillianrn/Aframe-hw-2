<!DOCTYPE html>
<html>
  <head>
    <title>A-Frame HW2</title> 
    <script src= "https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="Navigation.js"></script>
  </head>
  <body> 
    <a-scene>
      <a-box
      color="white"
      position="-30 1.5 30"
      rotation="0 45 0"
      width="5"
      height="5"
      depth="5">
    </a-box>
    <a-sphere
    color="white"
    position="-30 13 30"
    radius="2.5">
  </a-sphere>
  <a-cylinder
  color="white"
  position="-30 5.5 30"
  rotation="0 45 0"
  radius="2"
  height="12">
</a-cylinder>
      <a-assets>
        <img id="sand-base" src="assets\Stylized_Sand_002_basecolor.png">
        <img id="sand-ambient-occlusion" src="assets\Stylized_Sand_002_ambientOcclusion.png">  
        <img id="sand-normal" src="assets\Stylized_Sand_002_normal.png">   

        <img id="stone-base" src="assets\Stone_Floor_005_basecolor.jpg">
        <img id="stone-ambient-occlusion" src="assets\Stone_Floor_005_ambientOcclusion.jpg">  
        <img id="stone-normal" src="assets\Stone_Floor_005_normal.jpg"> 

        <img id="sky" src="assets/dramatic-panorama-sky-with-cloud-on-sunrise-and-sunset-time-free-photo.jpg"
      </a-assets> </a-assets>
      <a-asset-item
      id="rangeRover"
      src="assets\rr.glb">
    </a-asset-item>

    <a-asset-item
      id="Camel 1"
      src="assets\Camel1.glb">
    </a-asset-item>

    <a-asset-item
      id="Camel 2"
      src="assets\Camel2.glb">
    </a-asset-item>

    <a-asset-item
      id="Camel 3"
      src="assets\Camel3.glb">
    </a-asset-item>

    <a-asset-item
      id="Palm"
      src="assets\Palm.glb">
    </a-asset-item>

    <a-asset-item
      id="Palm"
      src="assets\Palm.glb">
    </a-asset-item>

    <a-asset-item
      id="Palm"
      src="assets\Palm.glb">
    </a-asset-item>

    <a-entity
    gltf-model="#rangeRover"
    position="80 1.5 20"
    rotation="0 95 0"
    scale="1 1 1"
    class="collidable">
  </a-entity>

  <a-entity
    gltf-model="#Camel 1"
    position="60 1 21"
    rotation="0 95 0"
    scale="0.01 0.01 0.01">
  </a-entity>

  <a-entity
    gltf-model="#Camel 2"
    position="57 0 20"
    rotation="0 95 0"
    scale=".3 .3 .3">
  </a-entity>

  <a-entity
    gltf-model="#Camel 3"
    position="53 0 23"
    rotation="0 95 0"
    scale=".3 .3 .3">
  </a-entity>

  <a-entity
    gltf-model="#Palm"
    position="20 0 30"
    rotation="0 95 0"
    scale=".3 .3 .3">
  </a-entity>

  <a-entity
    gltf-model="#Palm"
    position="70 0 30"
    rotation="0 95 0"
    scale=".3 .3 .3">
  </a-entity>

  <a-entity
    gltf-model="#Palm"
    position="50 0 20"
    rotation="0 95 0"
    scale=".3 .3 .3">
  </a-entity>
      
      <a-plane 
        material="src: #sand-base;
                  repeat: 500 500;
                  ambientOcclusionMap: #sand-ambient-occlusion;
                  ambinetOcclusionTextureRepeat: 500 500;
                  normalMap: #sand-normal;
                  normalTextureRepeat: 500 500"
        position="0 0 0" 
        rotation="-90 0 0" 
        width="500" 
        height="500"> 
      </a-plane> 

      <a-sky src="#sky" <a-sky></a-sky>

      </a-sky>
      
      <!-- Cone 1-->
      <a-cone 
        material="src: #stone-base;
                  repeat: 500 500;
                  ambientOcclusionMap: #stone-ambient-occlusion;
                  ambinetOcclusionTextureRepeat: 500 500;
                  normalMap: #stone-normal;
                  normalTextureRepeat: 500 500"
        position="0 1.5 -4" 
        radius-bottom="100" 
        height="110" 
        segments-radial="4" 
        roughness="0.4">
      </a-cone>

      <!-- Cone 2-->
      <a-cone
        material="src: #stone-base;
                  repeat: 500 500;
                  ambientOcclusionMap: #stone-ambient-occlusion;
                  ambinetOcclusionTextureRepeat: 500 500;
                  normalMap: #stone-normal;
                  normalTextureRepeat: 500 500"      
        position="70 1.5 -40" 
        radius-bottom="80" 
        height="80" 
        segments-radial="4" 
        roughness="0.4">
      </a-cone>

      <!-- Cone 3-->
      <a-cone 
        material="src: #stone-base;
            repeat: 500 500;
            ambientOcclusionMap: #stone-ambient-occlusion;
            ambinetOcclusionTextureRepeat: 500 500;
            normalMap: #stone-normal;
            normalTextureRepeat: 500 500"
        position="120 1.5 -20" 
        radius-bottom="60" 
        height="60" 
        segments-radial="4" 
        roughness="0.4">
      </a-cone>
      <a-entity 
  id="rig"
  navigation
>
  <a-camera 
    id="camera"
    wasd-controls="enabled: false"
    look-controls="enabled: false"
    cursor="rayOrigin: mouse"
    raycaster="objects: .clickable"
  >          
  </a-camera>
  <a-entity 
    id="right-hand" 
    laser-controls="hand: right"
    raycaster="objects: .clickable"
  >
  </a-entity>
  <a-entity 
    id="left-hand" 
    laser-controls="hand: left"
    raycaster="objects: .clickable"
  >
  </a-entity>
  <a-entity 
    id="feet-raycaster"
    raycaster=
      "objects: .collidable; 
       showLine:false; 
       far:5; 
       direction:0 -1 0" 
    position="0 0.5 0"
  >
  </a-entity>
</a-entity>
<a-entity id="raycasters">
  <a-entity 
    id="waist-raycaster-front"
    raycaster=
      "objects: .collidable; 
       showLine:false; 
       far:0.5" 
    position="0 1 0"
  >
  </a-entity>
  <a-entity 
    id="head-raycaster-front"
    raycaster=
      "objects: .collidable; 
       showLine:false; 
       far:0.5" 
    position="0 1.6 0"
  >
  </a-entity>
  <a-entity 
    id="knees-raycaster-front"
    raycaster=
      "objects: .collidable; 
       showLine:false;
       far:0.5" 
    position="0 0.5 0"
  >
  </a-entity>
  <a-entity 
    id="waist-raycaster-back"
    raycaster=
      "objects: .collidable; 
       showLine:false; 
       far:0.1; 
       direction:0 0 1" 
    position="0 1 0"
  >
  </a-entity>
  <a-entity 
    id="head-raycaster-back"
    raycaster=
      "objects: .collidable; 
       showLine:false; 
       far:0.1; 
       direction:0 0 1" 
    position="0 1.6 0"
  >
  </a-entity>
  <a-entity 
    id="knees-raycaster-back"
    raycaster=
      "objects: .collidable; 
       showLine:false; 
       far:0.1; 
       direction:0 0 1" 
    position="0 0.5 0"
  >
  </a-entity>
</a-entity>
    </a-scene>
  </body>
</html>
