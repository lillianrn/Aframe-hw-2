<!DOCTYPE html>
<html>
    <head>
         <title>A-Frame HW2
         </title> 
         <script src= "https://aframe.io/releases/1.7.0/aframe.min.js">
          </script>
          </head>
          <body> 
            <a-scene> 
                <a-plane 
                color="forestgreen" 
                position="0 0 0" 
                rotation="-90 0 0" 
                width="500" 
                height="500"> 
            </a-plane> 
            <a-sky 
            color="lightskyblue">
            </a-sky>
            <a-cone 
        position="0 1.5 -4" 
        radius-bottom="7" 
        height="9" 
        segments-radial="4" 
        color="yellow"
        roughness="0.4">
      </a-cone>
      <a-cone 
        position="15 1.5 -4" 
        radius-bottom="7" 
        height="9" 
        segments-radial="4" 
        color="yellow"
        roughness="0.4">
      </a-cone>
      <a-cone 
        position="-15 1.5 -4" 
        radius-bottom="7" 
        height="9" 
        segments-radial="4" 
        color="yellow"
        roughness="0.4">
      </a-cone>
            </a-scene>
        </body>
        </html>
