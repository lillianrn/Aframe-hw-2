<!DOCTYPE html>
<html>
  <head>
    <title>A-Frame HW2</title> 
    <script src= "https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body> 
    <a-scene>
      <a-assets>
        <img id="sand-base" src="assets\Stylized_Sand_002_basecolor.png">
        <img id="sand-ambient-occlusion" src="assets\Stylized_Sand_002_ambientOcclusion.png">  
        <img id="sand-normal" src="assets\Stylized_Sand_002_normal.png">   

        <img id="stone-base" src="assets\Stone_Floor_005_basecolor.jpg">
        <img id="stone-ambient-occlusion" src="assets\Stone_Floor_005_ambientOcclusion.jpg">  
        <img id="stone-normal" src="assets\Stone_Floor_005_normal.jpg"> 
      </a-assets>
      
      <a-plane 
        material="src: #sand-base;
                  repeat: 500 500;
                  ambientOcclusionMap: #sand-ambient-occlusion;
                  ambinetOcclusionTextureRepeat: 500 500;
                  normalMap: #sand-normal;
                  normalTextureRepeat: 500 500"
        position="0 0 0" 
        rotation="-90 0 0" 
        width="500" 
        height="500"> 
      </a-plane> 

      <a-sky color="lightskyblue"></a-sky>
      
      <!-- Cone 1-->
      <a-cone 
        material="src: #stone-base;
                  repeat: 500 500;
                  ambientOcclusionMap: #stone-ambient-occlusion;
                  ambinetOcclusionTextureRepeat: 500 500;
                  normalMap: #stone-normal;
                  normalTextureRepeat: 500 500"
        position="0 1.5 -4" 
        radius-bottom="7" 
        height="9" 
        segments-radial="4" 
        roughness="0.4">
      </a-cone>

      <!-- Cone 2-->
      <a-cone
        material="src: #stone-base;
                  repeat: 500 500;
                  ambientOcclusionMap: #stone-ambient-occlusion;
                  ambinetOcclusionTextureRepeat: 500 500;
                  normalMap: #stone-normal;
                  normalTextureRepeat: 500 500"      
        position="15 1.5 -4" 
        radius-bottom="10" 
        height="15" 
        segments-radial="4" 
        roughness="0.4">
      </a-cone>

      <!-- Cone 3-->
      <a-cone 
        material="src: #stone-base;
            repeat: 500 500;
            ambientOcclusionMap: #stone-ambient-occlusion;
            ambinetOcclusionTextureRepeat: 500 500;
            normalMap: #stone-normal;
            normalTextureRepeat: 500 500"
        position="-15 1.5 -4" 
        radius-bottom="7" 
        height="9" 
        segments-radial="4" 
        roughness="0.4">
      </a-cone>
    </a-scene>
  </body>
</html>
